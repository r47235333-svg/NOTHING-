
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nothing.</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #f8f8f8;
  font-family: Arial, sans-serif;
  color: #171717;
}

main {
  width: 88%;
  max-width: 520px;
  text-align: center;
}

h1 {
  font-size: 68px;
  letter-spacing: -4px;
  margin-bottom: 8px;
}

p { color: #888; }

form {
  display: flex;
  padding: 8px;
  gap: 8px;
  border: 1px solid #ddd;
  border-radius: 17px;
  background: white;
}

input {
  flex: 1;
  width: 0;
  padding: 12px;
  border: 0;
  outline: none;
  font-size: 14px;
}

button {
  border: 0;
  background: #171717;
  color: white;
  padding: 12px 16px;
  border-radius: 11px;
  cursor: pointer;
}

#answer { margin-top: 45px; }
#answer h2 { font-size: 32px; }

footer {
  margin-top: 50px;
  font-size: 11px;
  color: #aaa;
}
</style>
</head>

<body>
<main>
  <h1>nothing.</h1>
  <p>The internet's least helpful website.</p>

  <form id="form">
    <input
      id="question"
      placeholder="WHAT I SHOULD DO"
      aria-label="What I should do">
    <button type="submit">Search</button>
  </form>

  <section id="answer" aria-live="polite">
    <h2>NOTHING.</h2>
    <p>OPEN THE THING AND DO NOTHING</p>
  </section>

  <footer>nothing © absolutely nothing</footer>
</main>

<script>
document.getElementById("form").addEventListener("submit", function(e) {
  e.preventDefault();

  document.getElementById("answer").innerHTML =
    "<h2>NOTHING.</h2><p>OPEN THE THING AND DO NOTHING</p>";
});
</script>
</body>
</html>
